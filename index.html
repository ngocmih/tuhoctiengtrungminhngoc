<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Tự Học Tiếng Trung HSK 1 — Lộ Trình 18 Buổi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
    </style>
    <style>
      :root{
        --bg:#f4f5f7; --surface:#ffffff; --surface2:#eceef1; --ink:#1d222b; --ink2:#4c5563; --ink3:#79828f;
        --line:#dde1e7; --accent:#c23b22; --accent-ink:#a52f1a; --accent-soft:#fbeae5;
        --jade:#1f7a5c; --jade-soft:#e2f2ec; --gold:#b97f14; --gold-soft:#faf0da;
        --bad:#b3261e; --bad-soft:#fbe7e5; --shadow:0 6px 24px rgba(20,24,32,.08);
        --r-lg:16px; --r-md:12px; --r-sm:8px;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#121418; --surface:#1b1e24; --surface2:#242830; --ink:#eceef2; --ink2:#b6bdc9; --ink3:#8a93a1;
          --line:#30353f; --accent:#e2603f; --accent-ink:#f0856a; --accent-soft:#3a231c;
          --jade:#3fae87; --jade-soft:#173128; --gold:#d9a441; --gold-soft:#33290f;
          --bad:#e5736b; --bad-soft:#3a1d1a; --shadow:0 6px 24px rgba(0,0,0,.35);
        }
      }
      *{ box-sizing:border-box; }
      html{ -webkit-text-size-adjust:100%; }
      body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Be Vietnam Pro",system-ui,sans-serif; font-size:15.5px; line-height:1.55; }
      .hz{ font-family:"Noto Sans SC","Be Vietnam Pro",sans-serif; }
      button{ font:inherit; cursor:pointer; }
      a{ color:var(--accent-ink); }

      /* ---------- Layout ---------- */
      .app{ display:grid; grid-template-columns:308px minmax(0,1fr); min-height:100dvh; }
      .topbar{ display:none; }
      aside{ background:var(--surface); border-right:1px solid var(--line); padding:18px 14px 28px; position:sticky; top:0; height:100dvh; overflow-y:auto; }
      main{ padding:26px clamp(16px,4vw,44px) 70px; max-width:1060px; width:100%; margin:0 auto; }
      @media (max-width:900px){
        .app{ grid-template-columns:1fr; }
        .topbar{ display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:40; background:var(--surface); border-bottom:1px solid var(--line); padding:8px 12px; }
        aside{ display:none; position:fixed; inset:0 auto 0 0; width:min(86vw,320px); z-index:60; box-shadow:var(--shadow); }
        aside.open{ display:block; }
        .scrim{ display:none; position:fixed; inset:0; background:rgba(10,12,16,.45); z-index:55; }
        .scrim.on{ display:block; }
        main{ padding-top:18px; }
      }
      .scrim{ display:none; }

      /* ---------- Sidebar ---------- */
      .side-title{ font-weight:800; font-size:17px; letter-spacing:.1px; display:flex; align-items:center; gap:9px; }
      .side-title .seal{ background:var(--accent); color:#fff; font-family:"Noto Sans SC",sans-serif; font-weight:900; width:34px; height:34px; border-radius:9px; display:grid; place-items:center; font-size:19px; flex:none; }
      .side-sub{ color:var(--ink2); font-size:12.5px; margin:4px 0 14px 43px; }
      .prog-wrap{ margin:0 0 6px; background:var(--surface2); border-radius:var(--r-md); padding:12px 14px; }
      .prog-row{ display:flex; justify-content:space-between; font-size:13px; font-weight:600; }
      .prog-bar{ height:9px; background:var(--surface); border-radius:99px; overflow:hidden; margin-top:8px; }
      .prog-fill{ height:100%; background:var(--accent); border-radius:99px; transition:width .4s ease; }
      .side-tools{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0 4px; }
      .tool-btn{ display:flex; align-items:center; gap:8px; justify-content:center; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:9px 8px; font-weight:600; font-size:13.5px; color:var(--ink); min-height:44px; }
      .tool-btn:hover{ border-color:var(--accent); color:var(--accent-ink); }
      .tool-btn .cnt{ background:var(--accent); color:#fff; border-radius:99px; font-size:11.5px; padding:1px 7px; font-weight:700; }
      .part-label{ font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); margin:18px 4px 7px; }
      .litem{ display:flex; gap:10px; width:100%; text-align:left; background:transparent; border:1px solid transparent; border-radius:var(--r-md); padding:9px 10px; align-items:flex-start; color:var(--ink); }
      .litem:hover{ background:var(--surface2); }
      .litem.active{ background:var(--accent-soft); border-color:var(--accent); }
      .litem .num{ flex:none; width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line); display:grid; place-items:center; font-size:12.5px; font-weight:700; color:var(--ink2); background:var(--surface); }
      .litem.done .num{ background:var(--jade); border-color:var(--jade); color:#fff; }
      .litem.active .num{ border-color:var(--accent); color:var(--accent-ink); }
      .litem .tt{ font-weight:600; font-size:14px; line-height:1.35; }
      .litem .ss{ font-size:12px; color:var(--ink2); line-height:1.35; margin-top:1px; }
      .litem.review .num{ border-radius:9px; background:var(--gold-soft); border-color:var(--gold); color:var(--gold); }
      .litem.final .num{ border-radius:9px; background:var(--accent); border-color:var(--accent); color:#fff; }

      /* ---------- Generic ---------- */
      h1{ font-size:clamp(24px,4.5vw,34px); line-height:1.2; margin:0 0 6px; font-weight:800; }
      h2{ font-size:20px; margin:26px 0 10px; font-weight:700; }
      h3{ font-size:16.5px; margin:18px 0 8px; font-weight:700; }
      .lede{ color:var(--ink2); max-width:65ch; margin:0 0 8px; }
      .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px; }
      .btn{ display:inline-flex; align-items:center; gap:8px; border-radius:var(--r-md); border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:9px 16px; font-weight:600; min-height:44px; }
      .btn:hover{ border-color:var(--accent); }
      .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
      .btn.primary:hover{ background:var(--accent-ink); }
      .btn.jade{ background:var(--jade); border-color:var(--jade); color:#fff; }
      .btn.ghost{ background:transparent; }
      .btn:disabled{ opacity:.45; cursor:default; }
      .btn.small{ min-height:38px; padding:6px 12px; font-size:13.5px; }
      .chip{ display:inline-flex; align-items:center; gap:6px; background:var(--surface2); border-radius:99px; padding:3px 11px; font-size:12.5px; font-weight:600; color:var(--ink2); }
      .chip.red{ background:var(--accent-soft); color:var(--accent-ink); }
      .chip.jade{ background:var(--jade-soft); color:var(--jade); }
      .icon-btn{ width:40px; height:40px; flex:none; display:inline-grid; place-items:center; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink2); padding:0; }
      .icon-btn:hover{ color:var(--accent-ink); border-color:var(--accent); }
      .icon-btn.saved{ background:var(--gold-soft); border-color:var(--gold); color:var(--gold); }
      svg.ic{ width:19px; height:19px; flex:none; }
      .muted{ color:var(--ink2); } .small{ font-size:13px; }
      .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
      .spacer{ flex:1; }

      /* ---------- Home ---------- */
      .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:18px 0; }
      .stat{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px; }
      .stat .big{ font-size:27px; font-weight:800; line-height:1.1; }
      .stat .lbl{ color:var(--ink2); font-size:13px; margin-top:2px; }
      .path-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
      .path-card{ text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px; color:var(--ink); width:100%; }
      .path-card:hover{ border-color:var(--accent); }
      .path-card .tt{ font-weight:700; font-size:15.5px; margin:6px 0 3px; }
      .path-card .ss{ color:var(--ink2); font-size:13px; }

      /* ---------- Lesson ---------- */
      .lesson-head{ display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; }
      .lesson-head .hz-big{ font-size:clamp(30px,6vw,44px); font-weight:900; line-height:1.15; }
      .tabs{ display:flex; gap:6px; flex-wrap:wrap; margin:20px 0 18px; border-bottom:2px solid var(--line); padding-bottom:0; }
      .tab{ border:none; background:transparent; padding:10px 14px; font-weight:600; color:var(--ink2); border-bottom:3px solid transparent; margin-bottom:-2px; border-radius:8px 8px 0 0; min-height:44px; }
      .tab:hover{ color:var(--ink); }
      .tab.on{ color:var(--accent-ink); border-bottom-color:var(--accent); }
      .vocab-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:12px; }
      .vcard{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:14px; position:relative; }
      .vcard .hz{ font-size:27px; font-weight:700; line-height:1.25; word-break:keep-all; }
      .vcard .py{ color:var(--accent-ink); font-weight:600; margin-top:2px; }
      .vcard .vi{ margin-top:3px; }
      .vcard .hv{ color:var(--ink3); font-size:12.5px; }
      .vcard .acts{ position:absolute; top:8px; right:8px; display:flex; gap:6px; }
      .vcard .acts .icon-btn{ width:36px; height:36px; }
      .tone-table{ width:100%; border-collapse:collapse; }
      .tone-table th,.tone-table td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
      .tone-table th{ font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink3); }
      .tone-sig{ font-size:30px; font-weight:900; }
      .grp{ margin-bottom:20px; }
      .grp-head{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
      .grp-head .gname{ font-size:19px; font-weight:800; }
      .sound-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:10px; }
      .scard{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:12px; display:flex; gap:10px; align-items:center; }
      .scard .hz{ font-size:22px; font-weight:700; }
      .grammar-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px; margin-bottom:14px; }
      .formula{ background:var(--surface2); border-radius:var(--r-md); padding:11px 14px; font-weight:700; margin:8px 0; }
      .ex-row{ display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px dashed var(--line); }
      .ex-row:first-of-type{ border-top:none; }
      .ex-row .hz{ font-size:18.5px; font-weight:600; }
      .dlg{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px; margin-bottom:14px; }
      .line{ display:flex; gap:10px; margin:12px 0; align-items:flex-start; }
      .line .who{ flex:none; width:30px; height:30px; border-radius:50%; background:var(--surface2); display:grid; place-items:center; font-weight:800; font-size:13px; color:var(--ink2); }
      .line.b .who{ background:var(--accent-soft); color:var(--accent-ink); }
      .line .hz{ font-size:19px; font-weight:600; }
      .line .py{ color:var(--accent-ink); font-size:14px; }
      .line .vi{ color:var(--ink2); font-size:14px; }
      .nav-row{ display:flex; justify-content:space-between; gap:10px; margin-top:30px; flex-wrap:wrap; }

      /* ---------- Flashcard ---------- */
      .fc-stage{ perspective:1200px; max-width:520px; margin:6px auto; }
      .fc{ position:relative; width:100%; height:300px; transform-style:preserve-3d; transition:transform .5s ease; cursor:pointer; }
      .fc.flip{ transform:rotateY(180deg); }
      .fc-face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; background:var(--surface); border:1.5px solid var(--line); border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:22px; text-align:center; box-shadow:var(--shadow); }
      .fc-back{ transform:rotateY(180deg); }
      .fc .big-hz{ font-size:64px; font-weight:900; line-height:1.15; }
      .fc .py{ font-size:21px; color:var(--accent-ink); font-weight:700; }
      .fc .vi{ font-size:18px; }
      .fc .hint{ color:var(--ink3); font-size:13px; }
      .fc-nav{ display:flex; justify-content:center; gap:10px; align-items:center; margin-top:16px; flex-wrap:wrap; }

      /* ---------- Quiz ---------- */
      .quiz-q{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px; margin-bottom:14px; }
      .quiz-q .q{ font-weight:700; font-size:16.5px; margin-bottom:12px; }
      .quiz-q .q .hz{ font-size:19px; }
      .opts{ display:grid; gap:9px; }
      .opt{ text-align:left; border:1.5px solid var(--line); background:var(--surface); border-radius:var(--r-md); padding:12px 14px; font-weight:500; color:var(--ink); width:100%; min-height:48px; }
      .opt:hover:not(:disabled){ border-color:var(--accent); }
      .opt.right{ border-color:var(--jade); background:var(--jade-soft); }
      .opt.wrong{ border-color:var(--bad); background:var(--bad-soft); }
      .opt:disabled{ cursor:default; }
      .expl{ margin-top:12px; background:var(--surface2); border-radius:var(--r-md); padding:11px 14px; font-size:14px; }
      .wordbank{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
      .wchip{ border:1.5px solid var(--line); background:var(--surface); border-radius:99px; padding:8px 15px; font-size:18px; font-weight:600; min-height:44px; }
      .wchip:hover{ border-color:var(--accent); }
      .answer-line{ min-height:52px; border:1.5px dashed var(--line); border-radius:var(--r-md); padding:7px 10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; background:var(--surface2); }
      .answer-line .wchip{ background:var(--surface); border-color:var(--accent); }
      .score-banner{ border-radius:var(--r-lg); padding:20px; text-align:center; margin-bottom:16px; }
      .score-banner.good{ background:var(--jade-soft); border:1px solid var(--jade); }
      .score-banner.mid{ background:var(--gold-soft); border:1px solid var(--gold); }
      .score-banner .big{ font-size:32px; font-weight:800; }

      /* ---------- Planner / search ---------- */
      .field{ margin-bottom:14px; }
      .field label{ display:block; font-weight:600; margin-bottom:6px; }
      .field select,.field input[type="text"]{ width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:var(--r-md); background:var(--surface); color:var(--ink); font:inherit; min-height:48px; }
      .radio-row{ display:flex; gap:8px; flex-wrap:wrap; }
      .radio-pill{ border:1.5px solid var(--line); border-radius:99px; padding:9px 16px; font-weight:600; background:var(--surface); color:var(--ink); min-height:44px; }
      .radio-pill.on{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink); }
      .plan-table{ width:100%; border-collapse:collapse; }
      .plan-table th,.plan-table td{ text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
      .search-results{ margin-top:10px; display:grid; gap:8px; }
      .sr-item{ display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:10px 14px; color:var(--ink); min-height:52px; }
      .sr-item:hover{ border-color:var(--accent); }
      .empty{ text-align:center; color:var(--ink2); padding:34px 16px; border:1.5px dashed var(--line); border-radius:var(--r-lg); }
      .toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:99px; font-weight:600; font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:99; max-width:92vw; text-align:center; }
      .toast.on{ opacity:1; transform:translateX(-50%); }
      @media (prefers-reduced-motion: reduce){ .fc{ transition:none; } *{ scroll-behavior:auto !important; } }
    </style>
  </head>
  <body>
    <div class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Mở danh sách buổi học">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <strong>Tự Học Tiếng Trung HSK 1</strong>
      <span class="spacer"></span>
      <span class="chip red" id="topProg">0/18 buổi</span>
    </div>
    <div class="app">
      <div class="scrim" id="scrim"></div>
      <aside id="sidebar" aria-label="Lộ trình học"></aside>
      <main id="view" tabindex="-1"></main>
    </div>
    <div class="toast" id="toast" role="status"></div>

<script>
/* ================= ICONS ================= */
const IC = {
  spk:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.2 6a9 9 0 0 1 0 12"/></svg>',

  check:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>',
  play:'<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.8v14.4L19 12z"/></svg>',
  book:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5V5.5"/><path d="M20 18H6.5"/></svg>',
  spark:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/><path d="M19 16.5l.8 2.2 2.2.8-2.2.8L19 22.5l-.8-2.2-2.2-.8 2.2-.8z"/></svg>',

  search:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>'
};
</script>
<script>
/* ================= DỮ LIỆU 18 BUỔI ================= */
const LESSONS = [
/* ---------- BUỔI 1 ---------- */
{ n:1, kind:'pron', title:'Thanh điệu & Phụ âm', sub:'Nền tảng phát âm · Phần 1',
  intro:'Buổi đầu tiên và quan trọng nhất: nắm chắc 4 thanh điệu, thanh nhẹ và 21 thanh mẫu (phụ âm đầu). Đọc đúng thanh điệu ngay từ đầu sẽ giúp bạn tránh được lỗi phát âm khó sửa nhất về sau.',
  tones:[
    {sig:'ˉ', name:'Thanh 1 — thanh ngang', ex:'mā', hz:'妈', vi:'mẹ', desc:'Đọc cao, đều và kéo dài, như đang ngân nga một nốt nhạc cao. Giọng không lên không xuống.'},
    {sig:'ˊ', name:'Thanh 2 — thanh lên', ex:'má', hz:'麻', vi:'cây gai dầu', desc:'Đọc từ thấp lên cao, giống giọng hỏi “hả?” khi ngạc nhiên trong tiếng Việt.'},
    {sig:'ˇ', name:'Thanh 3 — thanh xuống–lên', ex:'mǎ', hz:'马', vi:'con ngựa', desc:'Đọc xuống thấp rồi hơi vồng lên cuối. Đây là thanh khó nhất với người Việt, cần luyện nhiều.'},
    {sig:'ˋ', name:'Thanh 4 — thanh xuống', ex:'mà', hz:'骂', vi:'mắng, chửi', desc:'Đọc dứt khoát từ cao xuống thấp, ngắn và mạnh, như giọng ra lệnh.'},

    {q:'“Chúng tôi đều là học sinh” — vị trí của 都 đúng là…', opts:['都 chúng tôi là học sinh','Chúng tôi 都 là học sinh','Chúng tôi là 都 học sinh','Chúng tôi là học sinh 都'], a:1, ex:'都 đứng sau chủ ngữ, trước động từ: 我们都是学生.'},
    {order:['她','买','了','不少','衣服'], vi:'Cô ấy đã mua không ít quần áo.', ex:'Động từ + 了 + tân ngữ: 买了不少衣服.'},
    {order:['我','没','看见','他'], vi:'Tôi đã không nhìn thấy anh ấy.', ex:'Phủ định việc đã xảy ra: 没 + động từ, không có 了.'}
  ]
},
/* ---------- BUỔI 18 · BÀI 15 ---------- */
{ n:18, kind:'std', bai:15, title:'Phương tiện & nhấn mạnh', hanzi:'我是坐飞机来的', sub:'Bài 15 · Cấu trúc 是…的',
  intro:'Bài cuối của HSK 1: nói cách di chuyển bằng phương tiện và nhấn mạnh chi tiết của việc đã xảy ra bằng cấu trúc 是…的.',
  vocab:[
    ['飞机','fēijī','máy bay','phi cơ'],['坐','zuò','đi (bằng phương tiện)','tọa'],
    ['来','lái','đến','lai'],['出租车','chūzūchē','taxi','xuất tô xa'],
    ['怎么','zěnme','thế nào, bằng cách nào',''],['火车','huǒchē','tàu hỏa','hỏa xa'],
    ['远','yuǎn','xa','viễn'],['近','jìn','gần','cận'],
    ['走路','zǒu lù','đi bộ','tẩu lộ'],['开车','kāi chē','lái xe','khai xa'],
    ['公共汽车','gōnggòng qìchē','xe buýt','công cộng khí xa'],['快','kuài','nhanh','khoái']
  ],
  grammar:[
    {t:'Cấu trúc nhấn mạnh 是…的', f:'Chủ ngữ + 是 + [thời gian/nơi chốn/cách thức] + động từ + 的', d:'Với việc đã xảy ra, 是…的 dùng để nhấn mạnh chi tiết: đến khi nào, ở đâu, bằng cách nào, cùng ai. 是 có thể lược bỏ nhưng 的 thì không: 我是坐飞机来的 (Tôi đến bằng máy bay).', ex:[['你是怎么来的？','Nǐ shì zěnme lái de?','Bạn đến bằng cách nào?'],['我是坐出租车来的。','Wǒ shì zuò chūzūchē lái de.','Tôi đến bằng taxi.'],['他是昨天来的。','Tā shì zuótiān lái de.','Anh ấy đến vào hôm qua.']]},
    {t:'Đi bằng phương tiện: 坐 + phương tiện', f:'坐 + 飞机/火车/出租车/公共汽车', d:'坐 dùng cho hầu hết phương tiện: 坐飞机 (đi máy bay), 坐火车 (đi tàu). Lái xe tự lái thì dùng 开车， đi bộ là 走路. Hỏi cách di chuyển: 你怎么去？(Bạn đi bằng gì?).', ex:[['我坐飞机去北京。','Wǒ zuò fēijī qù Běijīng.','Tôi đi máy bay đến Bắc Kinh.'],['学校很近，我走路去。','Xuéxiào hěn jìn, wǒ zǒu lù qù.','Trường rất gần, tôi đi bộ đến.']]}
  ],
  dlg:[
    {t:'Bạn đến bằng gì?', lines:[
      ['A','你是怎么来的？','Nǐ shì zěnme lái de?','Bạn đến bằng cách nào?'],
      ['B','我是坐飞机来的。','Wǒ shì zuò fēijī lái de.','Tôi đến bằng máy bay.'],
      ['A','飞机快吗？','Fēijī kuài ma?','Máy bay có nhanh không?'],
      ['B','很快，两个小时。','Hěn kuài, liǎng gè xiǎoshí.','Rất nhanh, hai tiếng.']
    ]},
    {t:'Đi học bằng gì?', lines:[
      ['A','你每天怎么去学校？','Nǐ měitiān zěnme qù xuéxiào?','Mỗi ngày bạn đến trường bằng gì?'],
      ['B','我坐公共汽车去，学校不太远。','Wǒ zuò gōnggòng qìchē qù, xuéxiào bú tài yuǎn.','Tôi đi xe buýt, trường không xa lắm.']
    ]}
  ],
  quiz:[
    {q:'Trong cấu trúc 是…的， thành phần nào KHÔNG được lược bỏ?', opts:['是','的','Chủ ngữ','Động từ'], a:1, ex:'Có thể lược bỏ 是 nhưng 的 bắt buộc phải giữ: 我坐飞机来的 vẫn đúng, thiếu 的 thì sai.'},
    {q:'“Đi tàu hỏa” nói thế nào?', opts:['开火车','坐火车','走火车','来火车'], a:1, ex:'Đi bằng phương tiện dùng 坐: 坐火车， 坐飞机， 坐出租车.'},
    {order:['我','是','坐','飞机','来','的'], vi:'Tôi đến bằng máy bay.', ex:'Cấu trúc nhấn mạnh: 是 + cách thức + động từ + 的.'},
    {order:['你','是','怎么','来','的'], vi:'Bạn đến bằng cách nào?', ex:'Hỏi cách thức của việc đã xảy ra: 是怎么来的？'}
  ]
}
);
</script>
<script>
/* ================= ỨNG DỤNG ================= */
const $ = s => document.querySelector(s);
const view = $('#view');
const state = { view:'home', lesson:1, tab:'vocab', done:new Set(), saved:new Map(), rate:1, showPy:true, showVi:true, quizBest:{} };
const CP = [
  {after:5,  name:'Ôn tập 1', range:[1,5],  desc:'Ôn lại phát âm nền tảng + Bài 1–2: chào hỏi, cảm ơn, quốc tịch, gia đình.'},
  {after:10, name:'Ôn tập 2', range:[6,10], desc:'Ôn Bài 3–7: giới thiệu người khác, tuổi tác, khả năng 会, ngày tháng.'},
  {after:15, name:'Ôn tập 3', range:[11,15],desc:'Ôn Bài 8–12: mua sắm, vị trí, xin phép, giờ giấc, thời tiết.'},
  {after:18, name:'Ôn tập 4', range:[16,18],desc:'Ôn Bài 13–15: hành động đang diễn ra, trợ từ 了, cấu trúc 是…的.'}
];
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(a,n){ return shuffle(a).slice(0,n); }
function lesson(n){ return LESSONS.find(l=>l.n===n); }
function vocabOf(l){ if(l.vocab) return l.vocab; const out=[]; (l.groups||[]).forEach(g=>g.items.forEach(it=>out.push([it[0],it[1],it[2],'']))); return out; }
function allVocab(range){ const out=[]; LESSONS.filter(l=>l.n>=range[0]&&l.n<=range[1]).forEach(l=>vocabOf(l).forEach(v=>out.push({v:v, ln:l.n}))); return out; }
const TOTAL_VOCAB = LESSONS.reduce((s,l)=>s+vocabOf(l).length,0);

/* ---------- Đọc phát âm (TTS) — ưu tiên giọng nữ ---------- */
let zhVoice=null;
function pickVoice(){
  try{
    const all=speechSynthesis.getVoices();
    const vs=all.filter(v=>/^zh/i.test(v.lang)||/chinese|mandarin|普通话|國語|国语|中文|粤語|粵語/i.test(v.name||''));
    if(!vs.length){ zhVoice=null; return; }
    /* Tên các giọng nữ tiếng Trung phổ biến trên Windows / Edge, Apple và Android */
    const femaleNames=['xiaoxiao','xiaohan','xiaomeng','xiaomo','xiaoqiu','xiaorui','xiaoshuang','xiaoxuan','xiaoya','xiaoyan','xiaoyi','xiaoyou','xiaozhen','xiaoxue','xiaoyu','xiaojie','huihui','yaoyao','ting-ting','tingting','ting ting','mei-jia','meijia','mei jia','sin-ji','sinji','sin ji','yu-shu','yushu','lili','xiaomei','xiaolin','xiaowen'];
    /* Tên các giọng nam tiếng Trung phổ biến — tránh chọn */
    const maleNames=['kangkang','yunyang','yunye','yunjian','yunxi','yunfeng','yunhao','zhiwei','guoliang','li-mu','limu','yunze','yunjie'];
    function score(v){
      const n=((v.name||'')+' '+(v.voiceURI||'')).toLowerCase();
      let s=0;
      if(/female|woman|girl/.test(n)) s+=120;
      if(femaleNames.some(x=>n.includes(x))) s+=90;
      if(maleNames.some(x=>n.includes(x))) s-=90;
      if(/(^|[^a-z])male([^a-z]|$)/.test(n)&&!/female/.test(n)) s-=120;
      if(/google/.test(n)) s+=20; /* Giọng Google 普通话 / 國語 mặc định là giọng nữ */
      if(/zh[-_]cn/i.test(v.lang)) s+=10;
      else if(/zh[-_]tw/i.test(v.lang)) s+=6;
      else if(/zh[-_]hk/i.test(v.lang)) s+=4;
      if(v.default) s+=2;
      return s;
    }
    vs.sort((a,b)=>score(b)-score(a));
    zhVoice=vs[0];
    const lbl=document.getElementById('voiceName');
    if(lbl) lbl.textContent=zhVoice?('Giọng nữ · '+zhVoice.name):'Giọng nữ (mặc định của thiết bị)';
  }catch(e){}
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text){ try{ if(!('speechSynthesis' in window)) return; if(!zhVoice) pickVoice(); const u=new SpeechSynthesisUtterance(text); u.lang='zh-CN'; if(zhVoice) u.voice=zhVoice; u.pitch=1.1; u.rate=state.rate; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
let toastTimer=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),2200); }

/* ---------- Sidebar ---------- */
function renderSidebar(){
  const sb=$('#sidebar'); const doneN=state.done.size;
  let h='<div class="side-title"><span class="seal">汉</span> Tự Học Tiếng Trung</div>'
    +'<div class="side-sub">Lộ trình HSK 1 · 18 buổi từ phát âm đến Bài 15</div>'
    +'<div class="prog-wrap"><div class="prog-row"><span>Tiến độ khóa học</span><span>'+doneN+'/18 buổi · '+Math.round(doneN/18*100)+'%</span></div>'
    +'<div class="prog-bar"><div class="prog-fill" style="width:'+(doneN/18*100)+'%"></div></div></div>'
    +'<div class="side-tools">'
    +'<button class="tool-btn" data-go="notebook">'+IC.book+' Sổ tay <span class="cnt" id="nbCount">'+state.saved.size+'</span></button>'
    +'<button class="tool-btn" data-go="planner">'+IC.spark+' Gợi ý lộ trình</button>'
    +'</div>'
    +'<div class="field" style="margin-top:12px"><label for="rateSel" class="small muted">Tốc độ đọc mẫu · <span id="voiceName">Giọng nữ</span></label>'
    +'<select id="rateSel"><option value="0.7">Chậm · 0.7x</option><option value="0.85">Vừa · 0.85x</option><option value="1">Chuẩn · 1.0x</option></select>'
    +'<div class="small muted" style="margin-top:6px">Đọc mẫu dùng giọng nữ tiếng Trung trên thiết bị của bạn.</div></div>';
  const item=(l)=>{
    const isA = state.view==='lesson'&&state.lesson===l.n;
    return '<button class="litem'+(state.done.has(l.n)?' done':'')+(isA?' active':'')+'" data-lesson="'+l.n+'">'
      +'<span class="num">'+(state.done.has(l.n)?'✓':l.n)+'</span>'
      +'<span><span class="tt">Buổi '+String(l.n).padStart(2,'0')+(l.bai?' · Bài '+l.bai:'')+': '+esc(l.title)+'</span>'
      +'<span class="ss" style="display:block">'+esc(l.sub)+'</span></span></button>';
  };
  const cpItem=(cp,i)=>{
    const isA = state.view==='review'&&state.cp===i;
    return '<button class="litem review'+(isA?' active':'')+'" data-cp="'+i+'"><span class="num">↻</span>'
      +'<span><span class="tt">'+cp.name+' · Buổi '+cp.range[0]+'–'+cp.range[1]+'</span>'
      +'<span class="ss" style="display:block">Flashcard + quiz tổng hợp</span></span></button>';
  };
  h+='<div class="part-label">Phần 1 · Phát âm nền tảng</div>';
  LESSONS.slice(0,3).forEach(l=>{ h+=item(l); });
  h+='<div class="part-label">Phần 2 · Giáo trình HSK 1 (Bài 1–15)</div>';
  LESSONS.slice(3).forEach(l=>{
    h+=item(l);
    CP.forEach((cp,i)=>{ if(cp.after===l.n) h+=cpItem(cp,i); });
  });
  h+='<button class="litem final'+(state.view==='final'?' active':'')+'" data-go="final"><span class="num">★</span>'
    +'<span><span class="tt">Kiểm tra cuối khóa</span><span class="ss" style="display:block">Mô phỏng HSK 1 · 20 câu · đạt từ 60%</span></span></button>';
  sb.innerHTML=h;
  if('speechSynthesis' in window) pickVoice();
  const vn=$('#voiceName'); if(vn) vn.textContent=zhVoice?('Giọng nữ · '+zhVoice.name):'Giọng nữ';
  $('#rateSel').value=String(state.rate);
  $('#rateSel').addEventListener('change',e=>{ state.rate=parseFloat(e.target.value); toast('Tốc độ đọc: '+state.rate+'x'); });
  sb.querySelectorAll('[data-lesson]').forEach(b=>b.addEventListener('click',()=>{ go('lesson',+b.dataset.lesson); }));
  sb.querySelectorAll('[data-cp]').forEach(b=>b.addEventListener('click',()=>{ go('review',+b.dataset.cp); }));
  sb.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{ go(b.dataset.go); }));
  const tp=$('#topProg'); if(tp) tp.textContent=doneN+'/18 buổi';
}
function closeDrawer(){ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); }
$('#menuBtn').addEventListener('click',()=>{ $('#sidebar').classList.add('open'); $('#scrim').classList.add('on'); });
$('#scrim').addEventListener('click',closeDrawer);

function go(v,param){
  state.view=v; closeDrawer();
  if(v==='lesson'){ state.lesson=param; state.tab = lesson(param).kind==='pron' ? 'sound' : 'vocab'; }
  if(v==='review'){ state.cp=param; }
  renderSidebar(); render(); window.scrollTo({top:0});
}

/* ================= TRANG CHỦ ================= */
function renderHome(){
  const next=LESSONS.find(l=>!state.done.has(l.n));
  const best=Object.values(state.quizBest);
  const avg=best.length? Math.round(best.reduce((a,b)=>a+b,0)/best.length) : null;
  let h='<h1>Lộ trình tự học HSK 1 — 18 buổi</h1>'
    +'<p class="lede">Ba buổi đầu xây nền phát âm (thanh điệu, nguyên âm, biến điệu), mười lăm buổi tiếp theo đi hết 15 bài của giáo trình HSK 1 chuẩn: từ vựng, ngữ pháp, hội thoại, flashcard và quiz sau mỗi buổi, kèm 4 chặng ôn tập và một bài kiểm tra cuối khóa mô phỏng đề HSK 1.</p>'
    +'<div class="stat-grid">'
    +'<div class="stat"><div class="big">'+state.done.size+'/18</div><div class="lbl">buổi đã hoàn thành</div></div>'
    +'<div class="stat"><div class="big">'+TOTAL_VOCAB+'</div><div class="lbl">từ vựng &amp; âm tiết toàn khóa</div></div>'
    +'<div class="stat"><div class="big">'+state.saved.size+'</div><div class="lbl">từ đang lưu trong sổ tay</div></div>'
    +'<div class="stat"><div class="big">'+(avg===null?'—':avg+'%')+'</div><div class="lbl">điểm quiz trung bình (lần tốt nhất)</div></div>'
    +'</div>';
  if(next){
    h+='<div class="card" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:20px"><div style="flex:1;min-width:220px">'
      +'<div class="chip red">Học tiếp</div><div style="font-weight:800;font-size:19px;margin-top:6px">Buổi '+next.n+': '+esc(next.title)+(next.hanzi?' · <span class="hz">'+esc(next.hanzi)+'</span>':'')+'</div>'
      +'<div class="muted small">'+esc(next.sub)+'</div></div>'
      +'<button class="btn primary" id="continueBtn">Vào buổi '+next.n+' →</button></div>';
  } else {
    h+='<div class="card" style="margin-bottom:20px"><strong>Bạn đã hoàn thành cả 18 buổi.</strong> <span class="muted">Hãy làm bài kiểm tra cuối khóa để đánh giá trình độ HSK 1 của mình.</span> <button class="btn primary" data-go="final" style="margin-left:8px">Kiểm tra cuối khóa</button></div>';
  }
  h+='<div class="card" style="margin-bottom:20px"><h3 style="margin-top:0">'+IC.search+' Tra cứu nhanh từ vựng</h3>'
    +'<div class="field" style="margin:0"><input type="text" id="searchBox" placeholder="Gõ chữ Hán, pinyin hoặc nghĩa tiếng Việt… ví dụ: 谢谢, xièxie, cảm ơn" /></div>'
    +'<div class="search-results" id="searchRes"></div></div>';
  h+='<h2>Tất cả các buổi</h2><div class="path-grid">';
  LESSONS.forEach(l=>{
    h+='<button class="path-card" data-lesson="'+l.n+'"><span class="chip '+(state.done.has(l.n)?'jade':'')+'">'+(state.done.has(l.n)?'✓ Đã học':'Buổi '+l.n+(l.bai?' · Bài '+l.bai:''))+'</span>'
      +'<div class="tt">'+esc(l.title)+'</div><div class="ss">'+esc(l.sub)+' · '+vocabOf(l).length+' mục từ vựng</div></button>';
  });
  h+='</div>';
  view.innerHTML=h;
  const cb=$('#continueBtn'); if(cb) cb.addEventListener('click',()=>go('lesson',next.n));
  view.querySelectorAll('[data-lesson]').forEach(b=>b.addEventListener('click',()=>go('lesson',+b.dataset.lesson)));
  view.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
  const sb=$('#searchBox');
  sb.addEventListener('input',()=>{
    const q=sb.value.trim().toLowerCase(); const box=$('#searchRes');
    if(!q){ box.innerHTML=''; return; }
    let out='';
    LESSONS.forEach(l=>{
      if(l.title.toLowerCase().includes(q)||(l.hanzi&&l.hanzi.includes(sb.value.trim()))) out+='<button class="sr-item" data-jump="'+l.n+'"><strong>Buổi '+l.n+': '+esc(l.title)+'</strong><span class="muted small">'+esc(l.sub)+'</span></button>';
      vocabOf(l).forEach(v=>{
        if(v[0].includes(sb.value.trim())||v[1].toLowerCase().includes(q)||v[2].toLowerCase().includes(q))
          out+='<button class="sr-item" data-jump="'+l.n+'"><span class="hz" style="font-size:20px;font-weight:700">'+esc(v[0])+'</span><span style="color:var(--accent-ink);font-weight:600">'+esc(v[1])+'</span><span>'+esc(v[2])+'</span><span class="spacer"></span><span class="chip">Buổi '+l.n+'</span></button>';
      });
    });
    box.innerHTML=out||'<div class="muted small" style="padding:6px 2px">Không tìm thấy kết quả nào.</div>';
    box.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>go('lesson',+b.dataset.jump)));
  });
}

/* ================= BUỔI HỌC ================= */
function speakBtn(text,cls){ return '<button class="icon-btn '+(cls||'')+'" data-say="'+esc(text)+'" aria-label="Nghe phát âm: '+esc(text)+'">'+IC.spk+'</button>'; }
function bindSay(root){ root.querySelectorAll('[data-say]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); speak(b.dataset.say); })); }

function renderLesson(){
  const l=lesson(state.lesson);
  const tabs = l.kind==='pron'
    ? [['sound','Phát âm'],['grammar','Lý thuyết'],['dialogue','Hội thoại'],['flash','Flashcard'],['quiz','Bài tập']]
    : [['vocab','Từ vựng'],['grammar','Ngữ pháp'],['dialogue','Hội thoại'],['flash','Flashcard'],['quiz','Bài tập']];
  let h='<div class="lesson-head"><div style="flex:1;min-width:240px">'
    +'<span class="chip red">Buổi '+l.n+(l.bai?' · Bài '+l.bai+' HSK 1':' · Phát âm nền tảng')+'</span>'
    +'<h1 style="margin-top:8px">'+esc(l.title)+(l.hanzi?' <span class="hz" style="color:var(--accent-ink)">'+esc(l.hanzi)+'</span>':'')+'</h1>'
    +'<p class="lede">'+esc(l.intro)+'</p></div>'
    +'<button class="btn '+(state.done.has(l.n)?'jade':'primary')+'" id="doneBtn">'+(state.done.has(l.n)?'✓ Đã hoàn thành':'Đánh dấu đã học xong')+'</button></div>';
  h+='<div class="tabs" role="tablist">'+tabs.map(t=>'<button class="tab'+(state.tab===t[0]?' on':'')+'" data-tab="'+t[0]+'" role="tab">'+t[1]+'</button>').join('')+'</div>';
  h+='<div id="tabBody"></div>';
  h+='<div class="nav-row">'
    +(l.n>1?'<button class="btn" id="prevBtn">← Buổi '+(l.n-1)+'</button>':'<span></span>')
    +(l.n<18?'<button class="btn primary" id="nextBtn">Buổi '+(l.n+1)+' →</button>':'<button class="btn primary" data-go="final">Kiểm tra cuối khóa ★</button>')
    +'</div>';
  view.innerHTML=h;
  view.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{ state.tab=b.dataset.tab; renderLesson(); }));
  $('#doneBtn').addEventListener('click',()=>{ if(state.done.has(l.n)){ state.done.delete(l.n); toast('Đã bỏ đánh dấu Buổi '+l.n); } else { state.done.add(l.n); toast('Đã hoàn thành Buổi '+l.n+'. Tốt lắm!'); } renderSidebar(); renderLesson(); });
  const pv=$('#prevBtn'); if(pv) pv.addEventListener('click',()=>go('lesson',l.n-1));
  const nx=$('#nextBtn'); if(nx) nx.addEventListener('click',()=>go('lesson',l.n+1));
  view.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
  renderTab(l);
}

function renderTab(l){
  const body=$('#tabBody');
  if(state.tab==='vocab') body.innerHTML=vocabHTML(l);
  else if(state.tab==='sound') body.innerHTML=soundHTML(l);
  else if(state.tab==='grammar') body.innerHTML=grammarHTML(l);
  else if(state.tab==='dialogue') body.innerHTML=dialogueHTML(l);
  else if(state.tab==='flash'){ body.innerHTML=flashHTML(); startFlash(vocabOf(l).map(v=>({hz:v[0],py:v[1],vi:v[2],hv:v[3]})),'Bộ thẻ Buổi '+l.n); bindFlash(body); }
  else if(state.tab==='quiz'){ body.innerHTML='<div id="quizRoot"></div>'; startQuiz(buildLessonQuiz(l),'lesson'+l.n); }
  bindSay(body); bindSave(body);
}
function bindSave(root){
  root.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click',()=>{
    const hz=b.dataset.save;
    if(state.saved.has(hz)){ state.saved.delete(hz); b.classList.remove('saved'); b.innerHTML=IC.bm; toast('Đã bỏ “'+hz+'” khỏi sổ tay'); }
    else { const l=lesson(state.lesson); const v=vocabOf(l).find(x=>x[0]===hz); state.saved.set(hz,{hz:v[0],py:v[1],vi:v[2],ln:l.n}); b.classList.add('saved'); b.innerHTML=IC.bmFill; toast('Đã lưu “'+hz+'” vào sổ tay'); }

    +'<div class="fc-face fc-back"><div class="big-hz hz" id="fcHz2" style="font-size:40px"></div><div class="py" id="fcPy"></div><div class="vi" id="fcVi"></div><div class="hint" id="fcHv"></div><button class="btn small" id="fcSay">'+IC.spk+' Nghe đọc</button></div>'
    +'</div></div>'
    +'<div class="fc-nav"><button class="btn" id="fcPrev">← Trước</button><span class="chip" id="fcCount"></span><button class="btn" id="fcNext">Tiếp →</button>'

    +'<div id="fcExtra"></div>';

function startFlash(deck,label){ FC={deck:deck.slice(), i:0, flip:false, label:label||''}; drawFlash(); }
function drawFlash(){
  if(!FC||!FC.deck.length) return;
  const c=FC.deck[FC.i];
  const card=$('#fcCard'); if(!card) return;
  card.classList.toggle('flip',FC.flip);
  $('#fcHz').textContent=c.hz; $('#fcHz2').textContent=c.hz;
  $('#fcPy').textContent=c.py; $('#fcVi').textContent=c.vi;
  $('#fcHv').textContent=c.hv?('Hán–Việt: '+c.hv):'';
  $('#fcCount').textContent=(FC.i+1)+' / '+FC.deck.length;
}
function bindFlash(root){
  const card=$('#fcCard'); if(!card) return;
  card.addEventListener('click',e=>{ if(e.target.closest('#fcSay')) return; FC.flip=!FC.flip; drawFlash(); });
  $('#fcSay').addEventListener('click',e=>{ e.stopPropagation(); speak(FC.deck[FC.i].hz); });
  $('#fcPrev').addEventListener('click',()=>{ FC.i=(FC.i-1+FC.deck.length)%FC.deck.length; FC.flip=false; drawFlash(); });
  $('#fcNext').addEventListener('click',()=>{ FC.i=(FC.i+1)%FC.deck.length; FC.flip=false; drawFlash(); });
  $('#fcShuffle').addEventListener('click',()=>{ FC.deck=shuffle(FC.deck); FC.i=0; FC.flip=false; drawFlash(); toast('Đã xáo trộn bộ thẻ'); });
}

/* ================= QUIZ ================= */
let QZ=null;
function genVocabQs(pool,n,usedHz){
  const qs=[]; const items=sample(pool.filter(p=>!usedHz||!usedHz.has(p.v[0])),n);
  const types=['mean','py','vi2hz','listen'];
  items.forEach((p,idx)=>{
    const v=p.v; const others=sample(pool.filter(x=>x.v[0]!==v[0]),3).map(x=>x.v);
    const t=types[idx%types.length];
    if(t==='mean'||t==='listen'){
      const opts=shuffle([v[2]].concat(others.map(o=>o[2])));
      qs.push({type:'mcq', audio:t==='listen'?v[0]:null,
        q:(t==='listen'?'Nghe và chọn nghĩa đúng của từ vừa phát:':'“<span class="hz">'+esc(v[0])+'</span>” nghĩa là gì?'),
        opts:opts, a:opts.indexOf(v[2]), ex:'<span class="hz">'+esc(v[0])+'</span> '+esc(v[1])+' = '+esc(v[2])+'.'});
    } else if(t==='py'){
      const opts=shuffle([v[1]].concat(others.map(o=>o[1])));
      qs.push({type:'mcq', q:'“<span class="hz">'+esc(v[0])+'</span>” đọc là…', opts:opts, a:opts.indexOf(v[1]), ex:'<span class="hz">'+esc(v[0])+'</span> đọc là '+esc(v[1])+'.'});
    } else {
      const opts=shuffle([v[0]].concat(others.map(o=>o[0])));
      qs.push({type:'mcq', q:'Từ nào có nghĩa “'+esc(v[2])+'”?', opts:opts, a:opts.indexOf(v[0]), hzOpts:true, ex:'<span class="hz">'+esc(v[0])+'</span> '+esc(v[1])+' = '+esc(v[2])+'.'});
    }
  });
  return qs;
}
function buildLessonQuiz(l){
  const hand=l.quiz.map(q=>{
    if(q.order) return {type:'order', words:q.order, vi:q.vi, ex:q.ex};
    return {type:'mcq', q:esc(q.q), opts:q.opts, a:q.a, ex:esc(q.ex)};
  });
  const pool=vocabOf(l).map(v=>({v:v}));
  const gen=genVocabQs(pool,4);
  return shuffle(hand.concat(gen));
}
function startQuiz(qs,key){
  QZ={qs:qs, key:key, answered:0, correct:0, done:{}};
  drawQuiz();
}
function drawQuiz(){
  const root=$('#quizRoot'); if(!root) return;
  let h='';
  if(QZ.answered===QZ.qs.length && QZ.qs.length){
    const pct=Math.round(QZ.correct/QZ.qs.length*100);
    const good=pct>=80;
    h+='<div class="score-banner '+(good?'good':'mid')+'"><div class="big">'+QZ.correct+'/'+QZ.qs.length+' câu đúng · '+pct+'%</div>'
      +'<div>'+(good?'Rất tốt! Bạn đã nắm chắc phần này.':'Khá ổn — xem lại phần giải thích của các câu sai rồi làm lại nhé.')+'</div>'
      +'<div style="margin-top:12px"><button class="btn primary" id="qRetry">Làm lại bài tập</button></div></div>';
    if(QZ.key && QZ.key.indexOf('lesson')===0){ const ln=+QZ.key.slice(6); const prev=state.quizBest[ln]||0; if(pct>prev) state.quizBest[ln]=pct; }
    if(QZ.key==='final'){ state.finalBest=Math.max(state.finalBest||0,pct); }
  }
  QZ.qs.forEach((q,qi)=>{
    h+='<div class="quiz-q"><div class="q">Câu '+(qi+1)+'. '+q.q
      +(q.audio?' <button class="icon-btn" data-qsay="'+qi+'" aria-label="Nghe lại">'+IC.spk+'</button>':'')+'</div>';
    if(q.type==='mcq'){
      h+='<div class="opts">'+q.opts.map((o,oi)=>{
        let cls='opt'; const st=QZ.done[qi];
        if(st){ if(oi===q.a) cls+=' right'; else if(oi===st.pick) cls+=' wrong'; }
        return '<button class="'+cls+'" data-q="'+qi+'" data-o="'+oi+'" '+(st?'disabled':'')+'>'+(q.hzOpts?'<span class="hz" style="font-size:18px">'+esc(o)+'</span>':esc(o))+'</button>';
      }).join('')+'</div>';
      if(QZ.done[qi]) h+='<div class="expl">'+(QZ.done[qi].ok?'✓ <strong>Đúng.</strong> ':'✗ <strong>Chưa đúng.</strong> ')+q.ex+'</div>';
    } else {
      const st=QZ.done[qi]; const picked=QZ['pick'+qi]||[];
      const rest=q.words.map((w,wi)=>({w:w,i:wi})).filter(x=>picked.indexOf(x.i)<0);
      h+='<div class="small muted">Sắp xếp các từ thành câu đúng — nghĩa: “'+esc(q.vi)+'”</div>'
        +'<div class="answer-line" data-ans="'+qi+'">'+picked.map(pi=>'<button class="wchip hz" data-unpick="'+qi+':'+pi+'">'+esc(q.words[pi])+'</button>').join('')+(picked.length?'':'<span class="muted small">Bấm các từ bên dưới theo thứ tự…</span>')+'</div>'
        +'<div class="wordbank">'+rest.map(x=>'<button class="wchip hz" data-pick="'+qi+':'+x.i+'">'+esc(x.w)+'</button>').join('')+'</div>'
        +(!st?'<button class="btn small primary" data-check="'+qi+'">Kiểm tra</button>':'<div class="expl">'+(st.ok?'✓ <strong>Đúng.</strong> ':'✗ <strong>Chưa đúng.</strong> Đáp án: <span class="hz">'+esc(q.words.join(''))+'</span>. ')+esc(q.ex||'')+'</div>');
    }
    h+='</div>';
  });
  root.innerHTML=h;
  root.querySelectorAll('[data-qsay]').forEach(b=>b.addEventListener('click',()=>speak(QZ.qs[+b.dataset.qsay].audio)));
  root.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    const qi=+b.dataset.q, oi=+b.dataset.o; const q=QZ.qs[qi];
    QZ.done[qi]={pick:oi, ok:oi===q.a}; QZ.answered++; if(oi===q.a) QZ.correct++;
    drawQuiz();
  }));
  root.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{
    const parts=b.dataset.pick.split(':'); const qi=+parts[0], wi=+parts[1];
    (QZ['pick'+qi]=QZ['pick'+qi]||[]).push(wi); drawQuiz();
  }));
  root.querySelectorAll('[data-unpick]').forEach(b=>b.addEventListener('click',()=>{
    const parts=b.dataset.unpick.split(':'); const qi=+parts[0], wi=+parts[1];
    QZ['pick'+qi]=QZ['pick'+qi].filter(x=>x!==wi); drawQuiz();
  }));
  root.querySelectorAll('[data-check]').forEach(b=>b.addEventListener('click',()=>{
    const qi=+b.dataset.check; const q=QZ.qs[qi]; const picked=QZ['pick'+qi]||[];
    const ok=picked.length===q.words.length && picked.every((wi,i)=>q.words[wi]===q.words[i] && wi===i) || (picked.map(i=>q.words[i]).join('')===q.words.join(''));
    QZ.done[qi]={ok:ok}; QZ.answered++; if(ok) QZ.correct++;
    drawQuiz();
  }));
  const rt=$('#qRetry'); if(rt) rt.addEventListener('click',()=>{ if(QZ.key&&QZ.key.indexOf('lesson')===0) startQuiz(buildLessonQuiz(lesson(+QZ.key.slice(6))),QZ.key); else location.hash=''; render(); });
}

/* ================= ÔN TẬP THEO CHẶNG ================= */
let RV=null;
function renderReview(){
  const cp=CP[state.cp];
  const pool=allVocab(cp.range);
  let h='<span class="chip red">Chặng ôn tập</span><h1 style="margin-top:8px">'+cp.name+' — Buổi '+cp.range[0]+' đến '+cp.range[1]+'</h1>'
    +'<p class="lede">'+esc(cp.desc)+' Chặng này có '+pool.length+' mục từ vựng. Ôn bằng flashcard tự chấm (đã thuộc / chưa thuộc — thẻ “chưa thuộc” sẽ quay lại cuối bộ), rồi làm quiz tổng hợp 12 câu.</p>'
    +'<h2>1 · Flashcard ôn tập</h2><div id="rvFlash"></div>'
    +'<h2>2 · Quiz tổng hợp</h2><div id="quizRoot"></div>';
  view.innerHTML=h;
  $('#rvFlash').innerHTML=flashHTML()+'<div class="fc-nav"><button class="btn jade" id="rvKnow">✓ Đã thuộc</button><button class="btn" id="rvAgain">↻ Chưa thuộc — ôn lại</button></div><p class="muted small" style="text-align:center" id="rvStat"></p>';
  RV={deck:shuffle(pool.map(p=>({hz:p.v[0],py:p.v[1],vi:p.v[2],hv:p.v[3]}))), i:0, flip:false, known:0, total:pool.length};
  FC=RV; drawFlash(); bindFlash($('#rvFlash'));
  const stat=()=>{ const el=$('#rvStat'); if(el) el.textContent='Đã thuộc: '+RV.known+'/'+RV.total+' · Còn trong bộ: '+RV.deck.length; };
  stat();
  $('#rvKnow').addEventListener('click',()=>{ RV.deck.splice(RV.i,1); RV.known++; if(RV.i>=RV.deck.length) RV.i=0; RV.flip=false; if(!RV.deck.length){ $('#rvFlash').innerHTML='<div class="score-banner good"><div class="big">Hoàn thành!</div><div>Bạn đã thuộc hết '+RV.total+' mục từ của chặng này.</div></div>'; } else { drawFlash(); } stat(); });
  $('#rvAgain').addEventListener('click',()=>{ const c=RV.deck.splice(RV.i,1)[0]; RV.deck.push(c); if(RV.i>=RV.deck.length) RV.i=0; RV.flip=false; drawFlash(); stat(); });
  const handQs=[];
  LESSONS.filter(l=>l.n>=cp.range[0]&&l.n<=cp.range[1]).forEach(l=>l.quiz.forEach(q=>{ if(!q.order) handQs.push({type:'mcq', q:esc(q.q), opts:q.opts, a:q.a, ex:esc(q.ex)}); }));
  const qs=shuffle(sample(handQs,6).concat(genVocabQs(pool,6)));
  const root=$('#quizRoot'); root.id='quizRoot';
  QZ=null; startQuiz(qs,'review'+state.cp);
}

/* ================= KIỂM TRA CUỐI KHÓA ================= */
function renderFinal(){
  let h='<span class="chip red">Đánh giá cuối khóa</span><h1 style="margin-top:8px">Kiểm tra mô phỏng HSK 1</h1>'
    +'<p class="lede">20 câu trắc nghiệm rút từ toàn bộ 15 bài: từ vựng, pinyin, ngữ pháp và nghe hiểu. Đạt từ 60% (12/20 câu) được xem là đạt chuẩn HSK 1 — tương đương mức 120/200 điểm của kỳ thi thật.</p>';
  if(state.finalBest) h+='<p><span class="chip jade">Điểm tốt nhất của bạn: '+state.finalBest+'%</span></p>';
  h+='<div id="quizRoot"></div>';
  view.innerHTML=h;
  const handQs=[];
  LESSONS.forEach(l=>l.quiz.forEach(q=>{ if(!q.order) handQs.push({type:'mcq', q:esc(q.q), opts:q.opts, a:q.a, ex:esc(q.ex)}); }));
  const pool=allVocab([1,18]);
  const qs=shuffle(sample(handQs,10).concat(genVocabQs(pool,10)));
  startQuiz(qs,'final');
}

/* ================= SỔ TAY ================= */
function renderNotebook(){
  const items=Array.from(state.saved.values());
  let h='<h1>Sổ tay từ vựng</h1><p class="lede">Những từ bạn đã bấm lưu khi học. Dùng chế độ ôn tập bên dưới để kiểm tra trí nhớ: thẻ nào chưa thuộc sẽ quay lại cho đến khi bạn thuộc hết.</p>';
  if(!items.length){
    h+='<div class="empty">Sổ tay đang trống.<br/>Khi học từ vựng ở mỗi buổi, bấm nút dấu trang trên thẻ từ để lưu từ khó vào đây.</div>';
  } else {
    h+='<div class="row" style="margin-bottom:14px"><button class="btn primary" id="nbReview">Ôn tập '+items.length+' từ bằng flashcard</button></div>'
      +'<div id="nbArea"></div><h2>Danh sách từ đã lưu</h2><div class="vocab-grid">'
      +items.map(it=>'<div class="vcard"><div class="acts">'+speakBtn(it.hz)+'<button class="icon-btn" data-del="'+esc(it.hz)+'" aria-label="Xóa khỏi sổ tay">✕</button></div>'
        +'<div class="hz">'+esc(it.hz)+'</div><div class="py">'+esc(it.py)+'</div><div class="vi">'+esc(it.vi)+'</div><div class="hv">Buổi '+it.ln+'</div></div>').join('')
      +'</div>';
  }
  view.innerHTML=h;
  bindSay(view);
  view.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{ state.saved.delete(b.dataset.del); renderSidebar(); renderNotebook(); }));
  const rb=$('#nbReview');
  if(rb) rb.addEventListener('click',()=>{
    const area=$('#nbArea');
    area.innerHTML=flashHTML()+'<div class="fc-nav"><button class="btn jade" id="nbKnow">✓ Đã thuộc</button><button class="btn" id="nbAgain">↻ Chưa thuộc — ôn lại</button></div><p class="muted small" style="text-align:center" id="nbStat"></p>';
    RV={deck:shuffle(items.map(it=>({hz:it.hz,py:it.py,vi:it.vi,hv:''}))), i:0, flip:false, known:0, total:items.length};
    FC=RV; drawFlash(); bindFlash(area);
    const stat=()=>{ const el=$('#nbStat'); if(el) el.textContent='Đã thuộc: '+RV.known+'/'+RV.total+' · Còn trong bộ: '+RV.deck.length; };
    stat();
    $('#nbKnow').addEventListener('click',()=>{ RV.deck.splice(RV.i,1); RV.known++; if(RV.i>=RV.deck.length) RV.i=0; RV.flip=false; if(!RV.deck.length){ area.innerHTML='<div class="score-banner good"><div class="big">Thuộc hết rồi!</div><div>Bạn đã thuộc cả '+RV.total+' từ trong sổ tay.</div></div>'; } else drawFlash(); stat(); });
    $('#nbAgain').addEventListener('click',()=>{ const c=RV.deck.splice(RV.i,1)[0]; RV.deck.push(c); if(RV.i>=RV.deck.length) RV.i=0; RV.flip=false; drawFlash(); stat(); });
    area.scrollIntoView({behavior:'smooth',block:'start'});
  });
}

/* ================= TRỢ LÝ GỢI Ý LỘ TRÌNH ================= */
let planSel={goal:'thi', days:4, mins:30};
function renderPlanner(){
  let h='<span class="chip red">Trợ lý gợi ý</span><h1 style="margin-top:8px">Xây lộ trình học theo nhịp của bạn</h1>'
    +'<p class="lede">Trả lời 3 câu hỏi ngắn, trang sẽ tính cho bạn: mỗi tuần học những buổi nào, ngày dự kiến hoàn thành cả 18 buổi, và cách chia thời gian trong một buổi học.</p>'
    +'<div class="card"><div class="field"><label>Mục tiêu học tiếng Trung của bạn</label><div class="radio-row" id="pGoal">'
    +[['thi','Thi lấy chứng chỉ HSK 1'],['giao','Giao tiếp cơ bản hằng ngày'],['dulich','Đi du lịch Trung Quốc'],['sothich','Học vì sở thích, không áp lực']].map(g=>'<button class="radio-pill'+(planSel.goal===g[0]?' on':'')+'" data-v="'+g[0]+'">'+g[1]+'</button>').join('')+'</div></div>'
    +'<div class="field"><label>Số ngày học mỗi tuần</label><div class="radio-row" id="pDays">'
    +[2,3,4,5,6,7].map(d=>'<button class="radio-pill'+(planSel.days===d?' on':'')+'" data-v="'+d+'">'+d+' ngày</button>').join('')+'</div></div>'
    +'<div class="field"><label>Thời gian cho mỗi buổi học</label><div class="radio-row" id="pMins">'
    +[15,30,45,60].map(m=>'<button class="radio-pill'+(planSel.mins===m?' on':'')+'" data-v="'+m+'">'+m+' phút</button>').join('')+'</div></div>'
    +'<button class="btn primary" id="pBuild">Tạo lộ trình cho tôi</button></div>'
    +'<div id="planOut" style="margin-top:18px"></div>';
  view.innerHTML=h;
  const bindRow=(id,key)=>{ view.querySelectorAll('#'+id+' .radio-pill').forEach(b=>b.addEventListener('click',()=>{ planSel[key]= isNaN(+b.dataset.v)? b.dataset.v : +b.dataset.v; renderPlanner(); })); };
  bindRow('pGoal','goal'); bindRow('pDays','days'); bindRow('pMins','mins');
  $('#pBuild').addEventListener('click',buildPlan);
}
function buildPlan(){
  const totalSessions=18+CP.length; // 18 buổi + 4 chặng ôn tập
  const weeks=Math.ceil(totalSessions/planSel.days);
  const finish=new Date(); finish.setDate(finish.getDate()+weeks*7);
  const fmt=d=>d.toLocaleDateString('vi-VN',{day:'numeric',month:'numeric',year:'numeric'});
  const units=[];
  LESSONS.forEach(l=>{ units.push('Buổi '+l.n+': '+l.title); CP.forEach(cp=>{ if(cp.after===l.n) units.push(cp.name+' (Buổi '+cp.range[0]+'–'+cp.range[1]+')'); }); });
  units.push('Kiểm tra cuối khóa mô phỏng HSK 1');
  let rows=''; let idx=0;
  for(let w=1; w<=weeks && idx<units.length; w++){
    const wk=units.slice(idx,idx+planSel.days); idx+=planSel.days;
    rows+='<tr><td><strong>Tuần '+w+'</strong></td><td>'+wk.join('<br/>')+'</td></tr>';
  }
  const m=planSel.mins;
  const split=[['Từ vựng + nghe đọc mẫu',Math.round(m*0.35)],['Ngữ pháp + ví dụ',Math.round(m*0.25)],['Hội thoại (đọc to, đóng vai)',Math.round(m*0.2)],['Flashcard + quiz cuối buổi',Math.max(5,m-Math.round(m*0.35)-Math.round(m*0.25)-Math.round(m*0.2))]];
  const goalNote={thi:'Mục tiêu thi HSK 1: đừng bỏ qua các chặng ôn tập và hãy làm bài kiểm tra cuối khóa ít nhất 2 lần trước ngày thi; điểm đạt là 60%.',
    giao:'Mục tiêu giao tiếp: ở mỗi buổi, hãy đọc to phần hội thoại ít nhất 3 lần và thử tự đóng cả hai vai trước khi xem bản dịch.',
    dulich:'Mục tiêu du lịch: ưu tiên thuộc lòng Bài 7 (ngày tháng), Bài 8 (mua sắm), Bài 11 (giờ giấc) và Bài 15 (phương tiện) — bốn bài dùng nhiều nhất khi đi lại.',
    sothich:'Mục tiêu sở thích: giữ nhịp đều quan trọng hơn học nhanh. Nếu một buổi thấy nặng, cứ chia buổi đó làm hai ngày, đừng bỏ dở giữa chừng.'}[planSel.goal];
  $('#planOut').innerHTML='<div class="card"><h3 style="margin-top:0">Lộ trình của bạn</h3>'
    +'<p>Với <strong>'+planSel.days+' ngày/tuần</strong>, mỗi buổi <strong>'+m+' phút</strong>, bạn sẽ hoàn thành 18 buổi + 4 chặng ôn tập + bài kiểm tra cuối khóa trong khoảng <strong>'+weeks+' tuần</strong> — dự kiến xong vào <strong>'+fmt(finish)+'</strong>.</p>'
    +'<p class="muted">'+goalNote+'</p>'
    +'<h3>Cách chia '+m+' phút trong một buổi học</h3>'
    +'<table class="plan-table">'+split.map(s=>'<tr><td>'+s[0]+'</td><td><strong>'+s[1]+' phút</strong></td></tr>').join('')+'</table>'
    +'<h3>Kế hoạch theo tuần</h3><table class="plan-table"><tr><th style="width:90px">Tuần</th><th>Nội dung</th></tr>'+rows+'</table>'
    +'<div class="row" style="margin-top:14px"><button class="btn primary" id="planStart">Bắt đầu Buổi 1 ngay</button></div></div>';
  $('#planStart').addEventListener('click',()=>go('lesson',1));
  $('#planOut').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ================= ĐIỀU HƯỚNG CHÍNH ================= */
function render(){
  if(state.view==='home') renderHome();
  else if(state.view==='lesson') renderLesson();
  else if(state.view==='review') renderReview();
  else if(state.view==='final') renderFinal();
  else if(state.view==='notebook') renderNotebook();
  else if(state.view==='planner') renderPlanner();
}
renderSidebar();
render();
</script>
